[project]
name = "prospecta"
dynamic = ["version"]
description = "Encontra empresas por segmento, cidade e bairro (Receita Federal + Google Maps)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50,<2",
    "duckdb>=1.3",
    "pandas>=2.2",
    "requests>=2.32",
    "rapidfuzz>=3.9",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.scripts]
prospecta = "prospecta.rodar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/prospecta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prospecta"]
